<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="dashboard-container">

    <!-- ===== HEADER: Clock, Date, Greeting, Name, Theme Toggle ===== -->
    <header class="card header-card">
      <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>

      <div class="clock-block">
        <div id="clock-display" aria-live="polite">00:00:00</div>
        <div id="date-display">Loading date…</div>
      </div>

      <div class="greeting-block">
        <span id="greeting-text">Good Morning</span>
        <div class="name-wrap">
          <span>,&nbsp;</span>
          <input
            type="text"
            id="user-name-input"
            placeholder="Enter your name"
            aria-label="Your name"
            maxlength="30"
          />
          <span>!</span>
        </div>
      </div>
    </header>

    <!-- ===== MAIN GRID ===== -->
    <main class="dashboard-grid">

      <!-- Focus Timer -->
      <section class="card timer-card" aria-labelledby="timer-title">
        <h2 id="timer-title">⏱ Focus Timer</h2>

        <div id="timer-display" aria-live="polite" aria-label="Timer display">25:00</div>

        <div class="timer-controls">
          <button id="timer-start" class="btn-primary" aria-label="Start timer">▶ Start</button>
          <button id="timer-stop"  class="btn-secondary" aria-label="Pause timer">⏸ Pause</button>
          <button id="timer-reset" class="btn-secondary" aria-label="Reset timer">↺ Reset</button>
        </div>

        <div class="timer-settings">
          <label for="custom-timer-min">Duration (min):</label>
          <input
            type="number"
            id="custom-timer-min"
            value="25"
            min="1"
            max="180"
            aria-label="Timer duration in minutes"
          />
          <button id="timer-apply" class="btn-small btn-primary" aria-label="Apply custom duration">Apply</button>
        </div>

        <div id="timer-progress-wrap" aria-hidden="true">
          <div id="timer-progress-bar"></div>
        </div>
      </section>

      <!-- To-Do List -->
      <section class="card tasks-card" aria-labelledby="tasks-title">
        <div class="section-header">
          <h2 id="tasks-title">📝 Tasks</h2>
          <select id="sort-tasks" aria-label="Filter tasks">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <form id="todo-form" class="input-row" novalidate>
          <input
            type="text"
            id="todo-input"
            placeholder="Add a new task…"
            aria-label="New task input"
            autocomplete="off"
            maxlength="120"
          />
          <button type="submit" class="btn-primary" aria-label="Add task">Add</button>
        </form>

        <ul id="todo-list" class="item-list" aria-label="Task list"></ul>
        <p id="todo-empty" class="empty-msg" aria-live="polite"></p>
      </section>

      <!-- Quick Links -->
      <section class="card links-card" aria-labelledby="links-title">
        <h2 id="links-title">🔗 Quick Links</h2>

        <form id="link-form" class="input-row link-form-row" novalidate>
          <input
            type="text"
            id="link-name"
            placeholder="Site name"
            aria-label="Link name"
            maxlength="30"
            required
          />
          <input
            type="url"
            id="link-url"
            placeholder="https://example.com"
            aria-label="Link URL"
            required
          />
          <button type="submit" class="btn-primary" aria-label="Add link">Add</button>
        </form>

        <div id="links-container" class="links-badges" aria-label="Quick links"></div>
        <p id="links-empty" class="empty-msg" aria-live="polite"></p>
      </section>

    </main>
  </div><!-- /.dashboard-container -->

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-box">
      <h3 id="modal-title">Edit Task</h3>
      <input type="text" id="edit-task-input" aria-label="Edit task text" maxlength="120" />
      <div class="modal-actions">
        <button id="modal-save"   class="btn-primary">Save</button>
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
